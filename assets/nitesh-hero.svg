<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Nitesh Ranjan Singh — Data Engineer and AI Engineer</title>
  <desc id="hero-desc">Burgundy data paths and orbital geometry. Glasgow, Scotland. MSc Data Science, University of Glasgow.</desc>
  <defs>
    <linearGradient id="hero-bg" x2="1" y2="1"><stop stop-color="#10070C"/><stop offset=".65" stop-color="#190B12"/><stop offset="1" stop-color="#451126"/></linearGradient>
    <radialGradient id="hero-light"><stop stop-color="#C77B9B" stop-opacity=".2"/><stop offset="1" stop-color="#701A3D" stop-opacity="0"/></radialGradient>
    <linearGradient id="hero-line"><stop stop-color="#701A3D"/><stop offset=".5" stop-color="#E5B5C7"/><stop offset="1" stop-color="#701A3D" stop-opacity="0"/></linearGradient>
    <pattern id="hero-grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#C77B9B" stroke-opacity=".07"/></pattern>
    <filter id="hero-glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>
  <style>@media (prefers-reduced-motion: reduce) { .hero-motion { display: none; } }</style>
  <rect width="1200" height="480" rx="20" fill="url(#hero-bg)"/>
  <rect width="1200" height="480" rx="20" fill="url(#hero-grid)"/>
  <ellipse cx="1000" cy="220" rx="330" ry="300" fill="url(#hero-light)"/>
  <ellipse class="hero-motion" cx="800" cy="220" rx="280" ry="220" fill="url(#hero-light)"><animate attributeName="cx" values="800;1080;800" dur="16s" repeatCount="indefinite"/></ellipse>
  <rect x="20.5" y="20.5" width="1159" height="439" rx="12" fill="none" stroke="#C77B9B" stroke-opacity=".22"/>
  <g fill="none" stroke="#C77B9B">
    <circle cx="1030" cy="230" r="121" stroke-opacity=".18"/>
    <circle cx="1030" cy="230" r="86" stroke-opacity=".22" stroke-dasharray="2 10"/>
    <ellipse cx="1030" cy="230" rx="155" ry="47" transform="rotate(-35 1030 230)" stroke-opacity=".35"/>
    <path d="M856 230h348M1030 60v340" stroke-opacity=".12"/>
  </g>
  <circle cx="934" cy="154" r="4" fill="#E5B5C7"/>
  <circle class="hero-motion" cx="934" cy="154" r="10" fill="#E5B5C7" opacity=".3" filter="url(#hero-glow)"><animate attributeName="opacity" values=".15;.6;.15" dur="4s" repeatCount="indefinite"/></circle>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
    <text x="64" y="81" fill="#C77B9B" font-size="14" letter-spacing="4">DATA SYSTEMS / APPLIED INTELLIGENCE</text>
    <text x="60" y="178" fill="#F8F0F3" font-size="65" font-weight="650" letter-spacing="-2">Nitesh Ranjan</text>
    <text x="60" y="249" fill="#F8F0F3" font-size="65" font-weight="650" letter-spacing="-2">Singh<tspan fill="#C77B9B">.</tspan></text>
    <text x="64" y="300" fill="#E5B5C7" font-size="25">Data Engineer <tspan fill="#701A3D">/</tspan> AI Engineer</text>
    <text x="64" y="345" fill="#E5B5C7" font-size="18">Reliable pipelines. Grounded AI. Useful things.</text>
    <text x="64" y="420" fill="#C77B9B" font-size="14" letter-spacing="1">GLASGOW, SCOTLAND</text>
    <text x="1140" y="420" fill="#C77B9B" font-size="14" text-anchor="end">MSc Data Science · University of Glasgow</text>
  </g>
  <path d="M64 372H720" stroke="url(#hero-line)" stroke-width="2"/>
  <path class="hero-motion" d="M64 372H720" stroke="#E5B5C7" stroke-width="2" stroke-dasharray="40 616" stroke-opacity=".65"><animate attributeName="stroke-dashoffset" values="656;0" dur="7s" repeatCount="indefinite"/></path>
</svg>
